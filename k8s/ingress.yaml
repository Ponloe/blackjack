
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: blackjack.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackjack
                port:
                  number: 80

    - host: nginx.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
