apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blackjack-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackjack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackjack
  template:
    metadata:
      labels:
        app: blackjack
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: blackjack
          image: blackjack:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: BLACKJACK_DB
              value: /var/lib/blackjack/session.sqlite3
            - name: BLACKJACK_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,[::1],blackjack.test"
          volumeMounts:
            - name: data
              mountPath: /var/lib/blackjack
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blackjack-data
---
apiVersion: v1
kind: Service
metadata:
  name: blackjack
spec:
  type: ClusterIP
  selector:
    app: blackjack
  ports:
    - name: http
      port: 80
      targetPort: http
